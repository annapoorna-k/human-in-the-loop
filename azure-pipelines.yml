trigger:
  branches:
    include:
      - main
      - feature

pr:
  branches:
    include:
      - main

variables:
  azureServiceConnection: 'rgatpl-service-connection'
  resourceGroup: 'rg-human'
  aksCluster: 'aks-human'
  aksNamespace: 'hitl-refund'
  acrName: 'acrhuman'

  imageRepository: 'hitl-refund'
  imageTag: '$(Build.BuildId)'
  fullImageName: 'acrhuman.azurecr.io/hitl-refund:$(Build.BuildId)'

  pythonVersion: '3.11'

stages:

# ============================================================
# STAGE 1 - BUILD & TEST
# ============================================================

- stage: Build
  displayName: 'Build and Test'

  jobs:
  - job: BuildAndTest
    displayName: 'Install Dependencies and Run Tests'

    pool:
      vmImage: 'ubuntu-latest'

    steps:
    - checkout: self
      displayName: 'Checkout source code'

    - task: UsePythonVersion@0
      displayName: 'Use Python 3.11'
      inputs:
        versionSpec: '$(pythonVersion)'

    - script: |
        set -e

        python --version
        python -m pip install --upgrade pip

        echo "Installing project dependencies..."

        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        else
          echo "ERROR: requirements.txt not found"
          exit 1
        fi
      displayName: 'Install Python dependencies'

    - script: |
        set -e

        export PYTHONPATH="$(Build.SourcesDirectory)/src"

        echo "Running unit tests..."

        if [ -d tests ]; then
          pytest -v
        else
          echo "No tests directory found."
          echo "Skipping pytest."
        fi
      displayName: 'Run unit tests'


# ============================================================
# STAGE 2 - SECURITY SCAN
# ============================================================

- stage: Security
  displayName: 'Security Scan'

  dependsOn: Build
  condition: succeeded()

  jobs:
  - job: SecurityScan
    displayName: 'Run Dependency Security Scan'

    pool:
      vmImage: 'ubuntu-latest'

    steps:
    - checkout: self
      displayName: 'Checkout source code'

    - task: UsePythonVersion@0
      displayName: 'Use Python 3.11'
      inputs:
        versionSpec: '$(pythonVersion)'

    - script: |
        set -e

        python --version
        python -m pip install --upgrade pip

        if [ ! -f requirements.txt ]; then
          echo "ERROR: requirements.txt not found"
          exit 1
        fi

        echo "Installing pip-audit..."
        pip install pip-audit

        echo "Running dependency security scan..."
        pip-audit -r requirements.txt
      displayName: 'Run pip-audit'


# ============================================================
# STAGE 3 - BUILD IMAGE IN AZURE CONTAINER REGISTRY
# ============================================================

- stage: Docker
  displayName: 'Build and Push Image to ACR'

  dependsOn: Security
  condition: succeeded()

  jobs:
  - job: ACRBuild
    displayName: 'Build Docker Image in ACR'

    pool:
      vmImage: 'ubuntu-latest'

    steps:
    - checkout: self
      displayName: 'Checkout source code'

    - task: AzureCLI@2
      displayName: 'Build and Push Image to ACR'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -e

          echo "=========================================="
          echo "AZURE / ACR INFORMATION"
          echo "=========================================="

          az account show --output table

          echo ""
          echo "ACR:"
          echo "$(acrName)"

          echo ""
          echo "IMAGE:"
          echo "$(fullImageName)"

          echo ""
          echo "=========================================="
          echo "VERIFY DOCKERFILE"
          echo "=========================================="

          if [ ! -f "$(Build.SourcesDirectory)/Dockerfile" ]; then
            echo "ERROR: Dockerfile not found in repository root."
            echo ""
            echo "Repository contents:"
            ls -la "$(Build.SourcesDirectory)"
            exit 1
          fi

          echo "Dockerfile found."

          echo ""
          echo "=========================================="
          echo "BUILDING IMAGE IN ACR"
          echo "=========================================="

          az acr build \
            --registry "$(acrName)" \
            --image "$(imageRepository):$(imageTag)" \
            "$(Build.SourcesDirectory)"

          echo ""
          echo "=========================================="
          echo "VERIFYING IMAGE"
          echo "=========================================="

          az acr repository show \
            --name "$(acrName)" \
            --image "$(imageRepository):$(imageTag)" \
            --output table

          echo ""
          echo "ACR BUILD COMPLETED SUCCESSFULLY."


# ============================================================
# STAGE 4 - DEPLOY TO AKS
# ============================================================

- stage: Deploy
  displayName: 'Deploy to AKS'

  dependsOn: Docker
  condition: succeeded()

  jobs:
  - deployment: DeployToAKS
    displayName: 'Deploy HITL Refund Application'

    pool:
      vmImage: 'ubuntu-latest'

    environment: 'hitl-refund-production'

    strategy:
      runOnce:
        deploy:
          steps:

          - checkout: self
            displayName: 'Checkout Kubernetes manifests'

          - task: AzureCLI@2
            displayName: 'Deploy Kubernetes Resources'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -e

                echo "=========================================="
                echo "GET AKS CREDENTIALS"
                echo "=========================================="

                az aks get-credentials \
                  --resource-group "$(resourceGroup)" \
                  --name "$(aksCluster)" \
                  --overwrite-existing

                echo ""
                echo "=========================================="
                echo "KUBERNETES CLUSTER"
                echo "=========================================="

                kubectl cluster-info

                echo ""
                echo "=========================================="
                echo "VERIFY NAMESPACE"
                echo "=========================================="

                kubectl get namespace "$(aksNamespace)"

                echo ""
                echo "=========================================="
                echo "KUBERNETES MANIFEST FILES"
                echo "=========================================="

                if [ ! -d "$(Build.SourcesDirectory)/k8s" ]; then
                  echo "ERROR: k8s directory not found."
                  exit 1
                fi

                find "$(Build.SourcesDirectory)/k8s" \
                  -maxdepth 1 \
                  -type f \
                  \( -name "*.yaml" -o -name "*.yml" \) \
                  -print

                echo ""
                echo "=========================================="
                echo "VALIDATING KUBERNETES MANIFESTS"
                echo "=========================================="

                kubectl apply \
                  --dry-run=client \
                  -f "$(Build.SourcesDirectory)/k8s" \
                  -n "$(aksNamespace)"

                echo ""
                echo "=========================================="
                echo "APPLY KUBERNETES MANIFESTS"
                echo "=========================================="

                kubectl apply \
                  -f "$(Build.SourcesDirectory)/k8s" \
                  -n "$(aksNamespace)"

                echo ""
                echo "=========================================="
                echo "DEPLOYMENT"
                echo "=========================================="

                kubectl get deployments \
                  -n "$(aksNamespace)"

                echo ""
                echo "=========================================="
                echo "UPDATE APPLICATION IMAGE"
                echo "=========================================="

                if kubectl get deployment hitl-refund \
                  -n "$(aksNamespace)" >/dev/null 2>&1; then

                  kubectl set image \
                    deployment/hitl-refund \
                    hitl-refund="$(fullImageName)" \
                    -n "$(aksNamespace)"

                else
                  echo "ERROR: deployment/hitl-refund was not found."
                  echo ""
                  echo "Available deployments:"
                  kubectl get deployments -n "$(aksNamespace)"
                  exit 1
                fi

                echo ""
                echo "=========================================="
                echo "WAIT FOR ROLLOUT"
                echo "=========================================="

                kubectl rollout status \
                  deployment/hitl-refund \
                  -n "$(aksNamespace)" \
                  --timeout=180s

                echo ""
                echo "=========================================="
                echo "DEPLOYMENT COMPLETED SUCCESSFULLY"
                echo "=========================================="


# ============================================================
# STAGE 5 - VERIFY DEPLOYMENT
# ============================================================

- stage: Verify
  displayName: 'Verify AKS Deployment'

  dependsOn: Deploy
  condition: succeeded()

  jobs:
  - job: VerifyDeployment
    displayName: 'Verify Application Deployment'

    pool:
      vmImage: 'ubuntu-latest'

    steps:
    - checkout: self
      displayName: 'Checkout source code'

    - task: AzureCLI@2
      displayName: 'Verify AKS Application'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -e

          echo "=========================================="
          echo "GET AKS CREDENTIALS"
          echo "=========================================="

          az aks get-credentials \
            --resource-group "$(resourceGroup)" \
            --name "$(aksCluster)" \
            --overwrite-existing

          echo ""
          echo "=========================================="
          echo "PODS"
          echo "=========================================="

          kubectl get pods \
            -n "$(aksNamespace)" \
            -o wide

          echo ""
          echo "=========================================="
          echo "DEPLOYMENT"
          echo "=========================================="

          kubectl get deployment \
            hitl-refund \
            -n "$(aksNamespace)"

          echo ""
          echo "=========================================="
          echo "SERVICE"
          echo "=========================================="

          kubectl get service \
            -n "$(aksNamespace)"

          echo ""
          echo "=========================================="
          echo "INGRESS"
          echo "=========================================="

          kubectl get ingress \
            -n "$(aksNamespace)" \
            -o wide

          echo ""
          echo "=========================================="
          echo "ROLLOUT STATUS"
          echo "=========================================="

          kubectl rollout status \
            deployment/hitl-refund \
            -n "$(aksNamespace)" \
            --timeout=180s

          echo ""
          echo "=========================================="
          echo "APPLICATION IMAGE"
          echo "=========================================="

          kubectl get deployment hitl-refund \
            -n "$(aksNamespace)" \
            -o jsonpath='{.spec.template.spec.containers[0].image}'

          echo ""

          echo ""
          echo "=========================================="
          echo "GET INGRESS IP"
          echo "=========================================="

          PUBLIC_IP=$(kubectl get ingress \
            -n "$(aksNamespace)" \
            -o jsonpath='{.items[0].status.loadBalancer.ingress[0].ip}')

          echo "Ingress IP: $PUBLIC_IP"

          if [ -z "$PUBLIC_IP" ]; then
            echo "WARNING: Ingress public IP was not assigned."

            kubectl get ingress \
              -n "$(aksNamespace)" \
              -o wide

            echo ""
            echo "Skipping external health check."
            exit 0
          fi

          echo ""
          echo "=========================================="
          echo "STREAMLIT HEALTH CHECK"
          echo "=========================================="

          echo "Testing:"
          echo "http://${PUBLIC_IP}/_stcore/health"

          for i in {1..12}; do

            if curl -fsS \
              "http://${PUBLIC_IP}/_stcore/health"; then

              echo ""
              echo ""
              echo "=========================================="
              echo "APPLICATION HEALTH CHECK PASSED"
              echo "=========================================="

              exit 0
            fi

            echo ""
            echo "Health check attempt $i failed."
            echo "Waiting 10 seconds..."

            sleep 10

          done

          echo ""
          echo "=========================================="
          echo "APPLICATION HEALTH CHECK FAILED"
          echo "=========================================="

          echo ""
          echo "Application logs:"

          kubectl logs \
            deployment/hitl-refund \
            -n "$(aksNamespace)" \
            --tail=100

          exit 1
